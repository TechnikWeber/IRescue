name: build & deploy web flasher

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware + filesystem
        working-directory: firmware
        run: |
          pio run
          pio run -t buildfs

      - name: Merge into one flashable image
        working-directory: firmware
        run: |
          B=.pio/build/esp32dev
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          mkdir -p ../webflasher/firmware
          cp $B/bootloader.bin $B/partitions.bin $B/firmware.bin $B/littlefs.bin "$BOOT" ../webflasher/firmware/
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 \
            merge_bin --fill-flash-size 4MB -o ../webflasher/firmware/irescue-full.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" \
            0x10000 $B/firmware.bin 0x290000 $B/littlefs.bin

      - name: Checksums
        working-directory: webflasher/firmware
        run: sha256sum *.bin > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: irescue-firmware
          path: |
            webflasher/firmware/*.bin
            webflasher/firmware/SHA256SUMS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher

  deploy:
    # Pages may only be published from main (environment rule); a tag only makes the release.
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # On a version tag: the merged image (esptool write-flash 0x0) and SHA256SUMS as a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: irescue-firmware, path: fw }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd fw
          cp irescue-full.bin "irescue-${GITHUB_REF_NAME#v}-esp32.bin"
          sha256sum "irescue-${GITHUB_REF_NAME#v}-esp32.bin" > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Flash from the browser: https://technikweber.github.io/IRescue/ — or, without it: esptool --chip esp32 write-flash 0x0 irescue-<version>-esp32.bin" \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "irescue-${GITHUB_REF_NAME#v}-esp32.bin" SHA256SUMS --clobber
