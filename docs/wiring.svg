<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui,Arial,sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#12141a">IRescue — Verdrahtung (ESP32 DevKit-C)</text>

  <!-- ESP32 -->
  <rect x="40" y="90" width="180" height="380" rx="12" fill="#1b1e27"/>
  <text x="130" y="120" font-size="18" font-weight="700" fill="#e6e8ee" text-anchor="middle">ESP32</text>
  <text x="130" y="140" font-size="13" fill="#8b90a0" text-anchor="middle">DevKit-C</text>

  <!-- pins (right side) -->
  <g font-size="14" fill="#e6e8ee" text-anchor="end">
    <text x="205" y="185">5V</text>
    <text x="205" y="235">GPIO4</text>
    <text x="205" y="290">GPIO34</text>
    <text x="205" y="345">3V3</text>
    <text x="205" y="400">GPIO27</text>
    <text x="205" y="450">GND</text>
  </g>
  <g fill="#4da3ff">
    <circle cx="220" cy="180" r="5"/><circle cx="220" cy="230" r="5"/>
    <circle cx="220" cy="285" r="5"/><circle cx="220" cy="340" r="5"/>
    <circle cx="220" cy="395" r="5"/><circle cx="220" cy="445" r="5"/>
  </g>

  <!-- ===== IR SENDER (top block) ===== -->
  <rect x="300" y="140" width="560" height="150" rx="10" fill="#f2f5fb" stroke="#c9d3e6"/>
  <text x="316" y="164" font-size="15" font-weight="700" fill="#12141a">IR-Sender</text>

  <!-- 5V -> 33R -> LED -> collector -->
  <line x1="220" y1="180" x2="360" y2="180" stroke="#e05d5d" stroke-width="3"/>
  <rect x="360" y="168" width="56" height="24" fill="#fff" stroke="#12141a"/>
  <text x="388" y="185" font-size="12" fill="#12141a" text-anchor="middle">33 Ω</text>
  <line x1="416" y1="180" x2="470" y2="180" stroke="#12141a" stroke-width="2"/>
  <!-- LED symbol -->
  <polygon points="470,168 470,192 494,180" fill="#e0a020"/>
  <line x1="494" y1="168" x2="494" y2="192" stroke="#12141a" stroke-width="3"/>
  <text x="482" y="150" font-size="12" fill="#12141a" text-anchor="middle">IR-LED 940nm</text>
  <line x1="494" y1="180" x2="560" y2="180" stroke="#12141a" stroke-width="2"/>
  <!-- transistor -->
  <circle cx="590" cy="180" r="26" fill="#fff" stroke="#12141a"/>
  <text x="590" y="184" font-size="12" fill="#12141a" text-anchor="middle">BC337</text>
  <text x="590" y="140" font-size="12" fill="#12141a" text-anchor="middle">C</text>
  <line x1="560" y1="180" x2="564" y2="180" stroke="#12141a" stroke-width="2"/>
  <!-- collector top, base left, emitter bottom -->
  <line x1="590" y1="154" x2="590" y2="160" stroke="#12141a" stroke-width="2"/>
  <!-- base from GPIO4 via 1k -->
  <line x1="220" y1="230" x2="470" y2="230" stroke="#4da3ff" stroke-width="3"/>
  <rect x="470" y="218" width="56" height="24" fill="#fff" stroke="#12141a"/>
  <text x="498" y="235" font-size="12" fill="#12141a" text-anchor="middle">1 kΩ</text>
  <line x1="526" y1="230" x2="564" y2="230" stroke="#12141a" stroke-width="2"/>
  <line x1="564" y1="230" x2="566" y2="200" stroke="#12141a" stroke-width="2"/>
  <text x="612" y="200" font-size="12" fill="#12141a">B</text>
  <!-- emitter to GND -->
  <line x1="590" y1="206" x2="590" y2="262" stroke="#12141a" stroke-width="2"/>
  <text x="602" y="230" font-size="12" fill="#12141a">E</text>
  <line x1="590" y1="262" x2="300" y2="262" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="300" y1="262" x2="300" y2="445" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="300" y1="445" x2="220" y2="445" stroke="#3a3a3a" stroke-width="3"/>

  <!-- ===== LIGHT SENSOR (middle) ===== -->
  <rect x="300" y="305" width="270" height="95" rx="10" fill="#eef7f0" stroke="#bfe0c9"/>
  <text x="316" y="329" font-size="15" font-weight="700" fill="#12141a">Lichtsensor TEMT6000</text>
  <line x1="220" y1="285" x2="330" y2="285" stroke="#48d18b" stroke-width="3"/>
  <text x="336" y="360" font-size="13" fill="#12141a">SIG → GPIO34</text>
  <line x1="330" y1="285" x2="330" y2="352" stroke="#48d18b" stroke-width="3"/>
  <text x="336" y="382" font-size="13" fill="#12141a">VCC → 3V3   ·   GND → GND</text>
  <line x1="220" y1="340" x2="322" y2="340" stroke="#e0a020" stroke-width="3"/>
  <line x1="322" y1="340" x2="322" y2="376" stroke="#e0a020" stroke-width="3"/>

  <!-- ===== IR RECEIVER (bottom, optional) ===== -->
  <rect x="300" y="410" width="270" height="95" rx="10" fill="#f7f0f0" stroke="#e6c9c9"/>
  <text x="316" y="434" font-size="15" font-weight="700" fill="#12141a">IR-Empfänger TSOP38238</text>
  <text x="316" y="452" font-size="12" fill="#8b90a0">optional — nur zum Anlernen</text>
  <line x1="220" y1="395" x2="336" y2="395" stroke="#c56ae0" stroke-width="3"/>
  <text x="336" y="480" font-size="13" fill="#12141a">OUT → GPIO27  ·  VCC → 3V3  ·  GND → GND</text>

  <!-- legend -->
  <text x="600" y="520" font-size="12" fill="#8b90a0">rot = 5V · blau = GPIO · grün/lila = Signal · grau = GND</text>
</svg>
